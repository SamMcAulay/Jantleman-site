<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Jantleman — Dashboard</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Jantleman">
  <meta property="og:title" content="The Jantleman — Server Dashboard">
  <meta property="og:description" content="Manage reputation settings, monitored channels, blacklists, and posting limits for your Discord server.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <div class="app-shell">

    <!-- ── Topbar ─────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-crest">&#x1F6E1;&#xFE0F;</div>
        <span class="brand-name">Jantleman</span>
      </div>

      <div class="topbar-center">
        <div class="guild-wrap">
          <span class="guild-label-inline">Server</span>
          <select id="guild-selector" class="guild-selector">
            <option value="">Loading servers…</option>
          </select>
        </div>
      </div>

      <div class="topbar-end">
        <span id="status" class="status loading">Connecting…</span>
        <button id="save-btn" class="btn-save" disabled>Save Changes</button>
        <button id="logout-btn" class="btn-logout-top">&#x2190; Log out</button>
      </div>
    </header>

    <!-- ── Tab Rail ──────────────────────────────── -->
    <nav class="tabrail">
      <button class="rail-tab active" data-tab="settings">
        <span class="rail-icon">&#x2699;&#xFE0F;</span> Settings
      </button>
      <button class="rail-tab" data-tab="channels">
        <span class="rail-icon">&#x1F4CB;</span> Channels
      </button>
      <button class="rail-tab" data-tab="members">
        <span class="rail-icon">&#x2B50;</span> Members
      </button>
      <button class="rail-tab" data-tab="blacklist">
        <span class="rail-icon">&#x26D4;</span> Blacklist
      </button>
      <button class="rail-tab" data-tab="limits">
        <span class="rail-icon">&#x23F1;&#xFE0F;</span> Limits
      </button>
      <button class="rail-tab" data-tab="reviewbans">
        <span class="rail-icon">&#x1F6AB;</span> Review Bans
      </button>
      <div class="tabrail-aux">
        <a href="/guide" class="rail-aux-link">&#x1F4D6; Guide</a>
        <a href="/admin" id="admin-link" class="rail-aux-link" style="display:none">&#x1F6E1;&#xFE0F; Admin</a>
      </div>
    </nav>

    <!-- ── Stage ─────────────────────────────────── -->
    <div class="stage-wrap">
      <div class="stage">

        <!-- Invite panel (shown when user admins no servers with the bot) -->
        <div id="invite-panel" class="invite-panel" hidden>
          <div class="invite-card">
            <span class="invite-bolt">&#x1F6E1;&#xFE0F;</span>
            <h2 class="invite-title">No Servers Found</h2>
            <p class="invite-desc">
              The Jantleman isn't in any servers you manage yet.<br>
              Invite it to a server to unlock the control panel.
            </p>
            <a id="invite-hero-btn" class="btn-invite-hero" target="_blank" rel="noopener">
              + Invite The Jantleman
            </a>
          </div>
        </div>

        <!-- Loading overlay -->
        <div id="loading-overlay">
          <div class="loading-spinner"></div>
        </div>

        <!-- Tab panels (rendered by dashboard.js) -->
        <div id="tab-settings"   class="tab-panel active"></div>
        <div id="tab-channels"   class="tab-panel"></div>
        <div id="tab-blacklist"  class="tab-panel"></div>
        <div id="tab-limits"     class="tab-panel"></div>
        <div id="tab-reviewbans" class="tab-panel"></div>
        <div id="tab-members"    class="tab-panel"></div>

      </div>
    </div>

  </div><!-- /app-shell -->

  <!-- Mobile bottom navigation -->
  <nav class="mobile-nav" id="mobile-nav">
    <button class="mobile-tab active" data-tab="settings">
      <span class="mobile-tab-icon">&#x2699;&#xFE0F;</span>
      Settings
    </button>
    <button class="mobile-tab" data-tab="channels">
      <span class="mobile-tab-icon">&#x1F4CB;</span>
      Channels
    </button>
    <button class="mobile-tab" data-tab="members">
      <span class="mobile-tab-icon">&#x2B50;</span>
      Members
    </button>
    <button class="mobile-tab" data-tab="blacklist">
      <span class="mobile-tab-icon">&#x26D4;</span>
      Blacklist
    </button>
    <button class="mobile-tab" data-tab="limits">
      <span class="mobile-tab-icon">&#x23F1;&#xFE0F;</span>
      Limits
    </button>
  </nav>

  <script src="js/config.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/dashboard.js?v=4"></script>
</body>
</html>
