<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Jantleman — Dashboard</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Jantleman">
  <meta property="og:title" content="The Jantleman — Server Dashboard">
  <meta property="og:description" content="Manage reputation settings, monitored channels, blacklists, and posting limits for your Discord server.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <canvas id="starfield"></canvas>

  <div class="dashboard-layout">

    <!-- ── Sidebar ─────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <span class="sidebar-bolt">🛡️</span>
          <span class="sidebar-name">JANTLEMAN</span>
        </div>

        <p class="guild-label">Server</p>
        <select id="guild-selector" class="guild-selector">
          <option value="">Loading servers…</option>
        </select>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section-label">Settings</p>

        <button class="nav-tab active" data-tab="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Settings</span>
        </button>

        <button class="nav-tab" data-tab="channels">
          <span class="nav-icon">📋</span>
          <span class="nav-label">Monitored Channels</span>
        </button>

        <button class="nav-tab" data-tab="blacklist">
          <span class="nav-icon">⛔</span>
          <span class="nav-label">Blacklist</span>
        </button>

        <button class="nav-tab" data-tab="limits">
          <span class="nav-icon">⏱️</span>
          <span class="nav-label">Posting Limits</span>
        </button>

        <p class="nav-section-label" style="margin-top:10px">Data</p>
        <button class="nav-tab" data-tab="members">
          <span class="nav-icon">⭐</span>
          <span class="nav-label">Members &amp; Reviews</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <a href="/guide.html" style="font-size:0.75rem;color:var(--text-2);text-decoration:none;" title="Command Guide">📖 Guide</a>
          <a href="/admin.html" id="admin-link" style="font-size:0.75rem;color:var(--text-2);text-decoration:none;display:none" title="Admin Dashboard">🛡️ Admin</a>
        </div>
        <span id="status" class="status loading">Connecting…</span>
        <button id="logout-btn" class="btn-logout">
          <span>↩</span> Log out
        </button>
      </div>
    </aside>

    <!-- ── Main ────────────────────────────────────── -->
    <main class="main">
      <header class="main-header">
        <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
        <h1 id="tab-heading">Settings</h1>
        <a id="invite-btn" class="btn-invite" target="_blank" rel="noopener">+ Add to Server</a>
        <button id="save-btn" class="btn-save" disabled>Save Changes</button>
      </header>

      <div class="main-body">

        <!-- Invite panel (shown when user admins no servers with the bot) -->
        <div id="invite-panel" class="invite-panel" hidden>
          <div class="invite-card">
            <span class="invite-bolt">🛡️</span>
            <h2 class="invite-title">No Servers Found</h2>
            <p class="invite-desc">
              The Jantleman isn't in any servers you manage yet.<br>
              Invite it to a server to unlock the control panel.
            </p>
            <a id="invite-hero-btn" class="btn-invite-hero" target="_blank" rel="noopener">
              + Invite The Jantleman to a Server
            </a>
          </div>
        </div>

        <!-- Loading overlay -->
        <div id="loading-overlay">
          <div class="loading-spinner"></div>
        </div>

        <!-- ── Settings Tab ───────────────────────── -->
        <div id="tab-settings" class="tab-panel active">
          <!-- rendered by dashboard.js -->
        </div>

        <!-- ── Channels Tab ──────────────────────── -->
        <div id="tab-channels" class="tab-panel">
          <!-- rendered by dashboard.js -->
        </div>

        <!-- ── Blacklist Tab ─────────────────────── -->
        <div id="tab-blacklist" class="tab-panel">
          <!-- rendered by dashboard.js -->
        </div>

        <!-- ── Limits Tab ────────────────────────── -->
        <div id="tab-limits" class="tab-panel">
          <!-- rendered by dashboard.js -->
        </div>

        <!-- ── Members Tab ───────────────────────── -->
        <div id="tab-members" class="tab-panel">
          <!-- rendered by dashboard.js -->
        </div>

      </div><!-- /main-body -->
    </main>

  </div><!-- /dashboard-layout -->

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <script src="js/config.js?v=1"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/api.js?v=1"></script>
  <script src="js/dashboard.js?v=1"></script>
</body>
</html>
